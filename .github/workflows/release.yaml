name: Release
# Push a vX.Y.Z tag that matches package.json: tests run, the image is pushed to Artifact Registry and deployed
# to Cloud Run (served at https://kong.runlocal.dev/identity-paths/). Infra lives in a private Terraform repo;
# the repo variables below come from its outputs.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # GitHub release
  id-token: write   # Workload Identity Federation

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGION: europe-west1
  SERVICE: identity-paths
  IMAGE: ${{ vars.IDENTITY_PATHS_IMAGE_REPO }}
  PROJECT: ${{ vars.GCP_PROJECT }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kong.runlocal.dev/identity-paths/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # the append-only codes test compares with the previous tag
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: test/tools/aigw-convert/go.mod, cache-dependency-path: test/tools/aigw-convert/go.sum }
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - name: Tests
        run: npm test
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build and push
        run: |
          V="${GITHUB_REF_NAME#v}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg APP_VERSION="$V" -t "$IMAGE:$V" .
          docker push "$IMAGE:$V"
      - name: Deploy
        run: |
          V="${GITHUB_REF_NAME#v}"
          gcloud run deploy "$SERVICE" --image "$IMAGE:$V" --region "$REGION" --project "$PROJECT" \
            --update-env-vars "APP_VERSION=$V" --max 2 --cpu-boost --quiet
      - name: Smoke test
        run: |
          V="${GITHUB_REF_NAME#v}"
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          for i in $(seq 1 10); do
            got=$(curl -sf "$URL/identity-paths/version.json" | jq -r .version) && [ "$got" = "$V" ] && exit 0
            sleep 5
          done
          echo "expected $V, got ${got:-nothing}"; exit 1
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME" --verify-tag

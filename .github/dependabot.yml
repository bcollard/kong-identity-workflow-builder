# Keeps the pinned action SHAs, the base image digest and the test tooling current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    groups: { test-tooling: { patterns: ["*"] } }
  - package-ecosystem: gomod
    directory: /test/tools/aigw-convert
    schedule: { interval: monthly }

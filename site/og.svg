<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social preview card (og:image). Source of site/og.png: `make og` renders it at 1200x630. -->
  <defs>
    <radialGradient id="glow" cx="1000" cy="120" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ccff00" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ccff00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#001408"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="8" fill="#ccff00"/>

  <!-- the favicon mark, scaled -->
  <g transform="translate(80 76) scale(2.5)">
    <rect width="32" height="32" rx="6" fill="#06200f" stroke="#2a3a1c"/>
    <circle cx="10.5" cy="16" r="5.5" fill="none" stroke="#ccff00" stroke-width="3"/>
    <path d="M16 16h12.5M22.5 16v5M27 16v4" fill="none" stroke="#ccff00" stroke-width="3"/>
  </g>
  <text x="182" y="114" font-family="Funnel Sans" font-weight="700" font-size="22" letter-spacing="3" fill="#ccff00">KONG IDENTITY BLUEPRINTS</text>

  <text x="80" y="262" font-family="Funnel Sans" font-weight="800" font-size="84" fill="#e7ede5">Identity Workflow Builder</text>
  <text font-family="Funnel Sans" font-weight="400" font-size="32" fill="#a1a69f">
    <tspan x="80" y="324">Pick a product, a caller, a credential and an IdP.</tspan>
    <tspan x="80" y="368">Get consumer groups, plugins, a sequence diagram and config.</tspan>
  </text>

  <!-- the wizard path -->
  <g font-family="Funnel Sans" font-weight="700" font-size="24" text-anchor="middle">
    <path d="M250 474h36M466 474h36M682 474h36M878 474h36" stroke="#54660a" stroke-width="3"/>
    <rect x="80" y="444" width="170" height="60" rx="30" fill="#0b2a16" stroke="#2a3a1c" stroke-width="2"/>
    <text x="165" y="482" fill="#e7ede5">Product</text>
    <rect x="286" y="444" width="180" height="60" rx="30" fill="#0b2a16" stroke="#2a3a1c" stroke-width="2"/>
    <text x="376" y="482" fill="#e7ede5">Caller</text>
    <rect x="502" y="444" width="180" height="60" rx="30" fill="#0b2a16" stroke="#2a3a1c" stroke-width="2"/>
    <text x="592" y="482" fill="#e7ede5">Credential</text>
    <rect x="718" y="444" width="160" height="60" rx="30" fill="#0b2a16" stroke="#2a3a1c" stroke-width="2"/>
    <text x="798" y="482" fill="#e7ede5">IdP</text>
    <rect x="914" y="444" width="206" height="60" rx="30" fill="#ccff00"/>
    <text x="1017" y="482" fill="#001408">Blueprint</text>
  </g>

  <text x="80" y="572" font-family="Menlo, monospace" font-size="22" fill="#a1a69f">kong.runlocal.dev/identity-paths</text>
  <text x="1120" y="572" font-family="Menlo, monospace" font-size="22" fill="#7d8a78" text-anchor="end">decK · Konnect API · Terraform</text>
</svg>
